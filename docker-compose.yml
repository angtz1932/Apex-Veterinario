version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apex_veterinario_db
    restart: always
    environment:
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_secure_password
      POSTGRES_DB: apex_veterinario
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_user -d apex_veterinario"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apex_veterinario_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@apexvet.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
